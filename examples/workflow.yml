# Keeps roadmap.json and roadmap/index.html in sync with pull request
# activity. Copy this file to .github/workflows/roadmap.yml.
#
# Needs one secret: ANTHROPIC_API_KEY (Settings > Secrets and variables >
# Actions). The workflow commits to the default branch, so it checks out that
# branch instead of the pull request's merge commit.
name: roadmap

on:
  pull_request:
    types: [opened, synchronize, closed]
  pull_request_review:
  pull_request_review_comment:
  issue_comment:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # nightly, so stale items show up without a pull request event

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: roadmap-live
  cancel-in-progress: false

jobs:
  roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: marvrue/roadmap-live@main
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
